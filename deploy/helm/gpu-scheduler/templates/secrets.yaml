apiVersion: v1
kind: Secret
metadata:
  name: gpu-scheduler-secrets
  labels: {{- include "gs.labels" . | nindent 4 }}
type: Opaque
stringData:
  apiToken: {{ include "gs.secretValue" (dict "root" . "key" "apiToken" "value" .Values.apiToken) | quote }}
  postgresPassword: {{ include "gs.secretValue" (dict "root" . "key" "postgresPassword" "value" .Values.postgres.password) | quote }}
  grafanaPassword: {{ include "gs.secretValue" (dict "root" . "key" "grafanaPassword" "value" .Values.monitoring.grafana.adminPassword) | quote }}
