{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "gs.labels" . | nindent 4 }}
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      securityContext: {runAsUser: 70, runAsGroup: 70, fsGroup: 70, runAsNonRoot: true}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_USER, value: gpusched}
            - {name: POSTGRES_DB, value: gpusched}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: gpu-scheduler-secrets, key: postgresPassword}}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, gpusched]}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "gs.labels" . | nindent 4 }}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: pg}]
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "gs.labels" . | nindent 4 }}
    app: redis
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata:
      labels: {app: redis}
    spec:
      securityContext: {runAsUser: 999, runAsNonRoot: true}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # appendonly: the intake stream survives a Redis restart.
          args: ["--appendonly", "yes", "--dir", "/data"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "gs.labels" . | nindent 4 }}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: redis}]
{{- end }}
